<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ILJS 图床上传</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #020617;
      color: #e5e7eb;
      font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
    }

    .box {
      width: min(560px, calc(100vw - 32px));
      padding: 28px;
      border-radius: 22px;
      background: #0f172a;
      border: 1px solid #1e293b;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 26px;
    }

    p {
      margin: 0 0 20px;
      color: #94a3b8;
      font-size: 14px;
    }

    label {
      display: block;
      margin: 16px 0 8px;
      color: #cbd5e1;
      font-size: 14px;
    }

    input,
    textarea,
    button {
      width: 100%;
      border-radius: 12px;
      font-size: 15px;
    }

    input,
    textarea {
      padding: 12px 14px;
      color: #e5e7eb;
      background: #020617;
      border: 1px solid #334155;
      outline: none;
    }

    button {
      margin-top: 18px;
      padding: 13px 16px;
      border: 0;
      cursor: pointer;
      color: #020617;
      background: #38bdf8;
      font-weight: 700;
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    textarea {
      margin-top: 16px;
      height: 150px;
      resize: none;
      line-height: 1.6;
    }

    img {
      display: none;
      margin-top: 16px;
      max-width: 100%;
      max-height: 320px;
      border-radius: 14px;
      border: 1px solid #334155;
    }

    .msg {
      min-height: 22px;
      margin-top: 12px;
      color: #94a3b8;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <main class="box">
    <h1>ILJS 图床上传</h1>
    <p>上传图片，自动生成直链、Markdown、HTML。</p>

    <label for="token">上传密钥</label>
    <input id="token" type="password" placeholder="输入你的 UPLOAD_TOKEN" />

    <label for="file">选择图片</label>
    <input id="file" type="file" accept="image/*" />

    <button id="uploadBtn">上传图片</button>

    <div class="msg" id="msg"></div>

    <img id="preview" alt="preview" />

    <textarea id="result" readonly placeholder="上传成功后，链接会显示在这里"></textarea>
  </main>

  <script>
    const API = "https://up.iljs.top/upload";

    const tokenInput = document.querySelector("#token");
    const fileInput = document.querySelector("#file");
    const uploadBtn = document.querySelector("#uploadBtn");
    const msg = document.querySelector("#msg");
    const result = document.querySelector("#result");
    const preview = document.querySelector("#preview");

    uploadBtn.addEventListener("click", async () => {
      const token = tokenInput.value.trim();
      const file = fileInput.files[0];

      if (!token) {
        msg.textContent = "请输入上传密钥。";
        return;
      }

      if (!file) {
        msg.textContent = "请选择图片。";
        return;
      }

      const formData = new FormData();
      formData.append("file", file);

      uploadBtn.disabled = true;
      uploadBtn.textContent = "上传中...";
      msg.textContent = "正在上传...";

      try {
        const res = await fetch(API, {
          method: "POST",
          headers: {
            Authorization: `Bearer ${token}`
          },
          body: formData
        });

        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.error || "上传失败");
        }

        result.value = [
          data.url,
          "",
          data.markdown,
          "",
          data.html
        ].join("\n");

        preview.src = data.url;
        preview.style.display = "block";

        await navigator.clipboard.writeText(data.markdown);

        msg.textContent = "上传成功，Markdown 已复制。";
      } catch (err) {
        msg.textContent = err.message;
      } finally {
        uploadBtn.disabled = false;
        uploadBtn.textContent = "上传图片";
      }
    });
  </script>
</body>
</html>
